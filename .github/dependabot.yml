version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      electron-runtime:
        patterns:
          - "electron"
          - "@electron/*"
      development-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "electron-builder"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
